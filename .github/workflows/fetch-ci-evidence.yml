# ONE-SHOT, evidence transport only. Downloads the ORIGINAL job logs of run 41404721275 through the Actions API
# (runners can reach log storage; the artifact download was unavailable) and commits them byte-for-byte. Removed in the final commit.
name: fetch-ci-evidence
on:
  push:
    branches: ['evidence/**']
permissions:
  actions: read
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original run metadata and job logs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: "41404721275"
        run: |
          set -euo pipefail
          D=docs/testing/evidence/raw
          mkdir -p "$D"
          api() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$1" -o "$2"; }
          api "https://api.github.com/repos/$REPO/actions/runs/$RUN" "$D/run-$RUN.json"
          api "https://api.github.com/repos/$REPO/actions/runs/$RUN/jobs?per_page=100" "$D/run-$RUN.jobs.json"
          for J in 125144042093 125144041843; do api "https://api.github.com/repos/$REPO/actions/jobs/$J/logs" "$D/job-$J.log"; done
          for f in "$D"/*; do test -s "$f" || { echo "empty: $f"; exit 1; }; done
          (cd "$D" && sha256sum * > ../raw-transport.sha256)
          cat docs/testing/evidence/raw-transport.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/testing/evidence
          git commit -m "evidence: raw job logs for run $RUN fetched via Actions API (transport only, unmodified)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
