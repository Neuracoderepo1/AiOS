name: AiOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Tool versions are pinned so a run is reproducible. Bump deliberately, in a PR that shows this workflow green.
#   Deno 2.9.8 is the version `v2.x` resolved to in the last green run before pinning (run 41403693969).
#   Supabase CLI 2.122.0 is the npm `latest` stable at that time (the previous `latest` pin did not record the version).
env:
  DENO_VERSION: "2.9.8"
  SUPABASE_CLI_VERSION: "2.122.0"
  # Independent anchor for the active integrity pin file (matrix-v1). Changing this value is a deliberate,
  # CODEOWNERS-reviewed act; see docs/testing/INTEGRITY.md.
  ACTIVE_PINS: "tests/integrity/pins/matrix-v1.pins"
  ACTIVE_PINS_SHA256: "e72d9171442047e6aac270cbea9ce9362b68d827a9112201e189e4c556d05a95"

jobs:
  evidence-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify evidence + manifest against pinned hashes
        run: python3 tests/integrity/verify_integrity.py --root . --pins "$ACTIVE_PINS" --expect-pins-sha256 "$ACTIVE_PINS_SHA256"
      - name: Integrity mutation tests (7 required cases)
        run: python3 tests/integrity/test_integrity_mutations.py -v

  functions-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Edge Function ordering and integrity invariants (O1-O6)
        run: python3 tests/functions/check_function_invariants.py
      - name: Type-check Edge Functions
        run: |
          set +e
          deno --version
          : > /tmp/out.txt
          for f in supabase/functions/*/index.ts; do echo "== $f" >> /tmp/out.txt; NO_COLOR=1 deno check "$f" 2>&1 | grep -vE "^(Download|Check) " >> /tmp/out.txt; [ "${PIPESTATUS[0]}" -eq 0 ] && echo "PASS $f" >> /tmp/out.txt || echo "FAILED $f" >> /tmp/out.txt; done
          cat /tmp/out.txt
          if grep -q '^FAILED' /tmp/out.txt; then
            echo "::error title=typecheck::$(sed 's/\x1b\[[0-9;]*m//g' /tmp/out.txt | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          fi

  functions-behavioral:
    runs-on: ubuntu-latest
    env:
      DENO_RUN: "deno test --import-map=tests/functions/behavioral/import_map.json --allow-env --allow-read"
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Record identity of what is under test
        run: |
          {
            echo "commit: $GITHUB_SHA"
            echo "checked-out HEAD: $(git rev-parse HEAD)"
            echo "pull-request head (the commit that was pushed): ${{ github.event.pull_request.head.sha || github.sha }}"
            echo "functions tree: $(git rev-parse HEAD:supabase/functions)"
            deno --version
          } | tee identity.txt
      - name: Behavioral suite (Deno)
        run: |
          set -o pipefail
          NO_COLOR=1 $DENO_RUN tests/functions/behavioral/ 2>&1 | tee behavioral.txt
      - name: Dependency resolution - no remote imports, no network (Deno --no-remote)
        run: |
          set -o pipefail
          NO_COLOR=1 $DENO_RUN --no-remote tests/functions/behavioral/ 2>&1 | tee noremote.txt
      - name: Invariant checks (O1-O7)
        run: |
          set -o pipefail
          python3 tests/functions/check_function_invariants.py 2>&1 | tee invariants.txt
      - name: Mutation (negative) checks under Deno
        run: |
          set -o pipefail
          NO_COLOR=1 python3 tests/functions/behavioral/run_mutants.py --runner "$DENO_RUN tests/functions/behavioral/" --json mutants.json 2>&1 | tee mutation.txt
      - name: Terminal-mission and mission-start race closure probes (required)
        run: |
          set -o pipefail
          NO_COLOR=1 $DENO_RUN tests/functions/behavioral/gaps/*.gap.ts 2>&1 | tee gaps.txt
      - name: Upload behavioral evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavioral-evidence
          path: |
            identity.txt
            behavioral.txt
            noremote.txt
            invariants.txt
            mutation.txt
            mutants.json
            gaps.txt

  migrations-and-sql-tests:
    needs: evidence-integrity   # integrity must pass before the matrix is accepted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Migration version uniqueness and ordering
        run: |
          ls supabase/migrations | sed 's/_.*//' | sort | uniq -d | tee /tmp/dups
          test ! -s /tmp/dups
      - name: Guard restoration migration against ALTER ROLE
        run: python3 tests/security/check_restorer_role_guard.py --self-test --migration supabase/migrations/20261109120000_aios_restoration_part_d.sql
      - name: Start local stack and apply ALL migrations from scratch
        id: start
        run: |
          set +e
          supabase --version
          supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector > /tmp/start.txt 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error title=db-start-or-reset::$(sed 's/\x1b\[[0-9;]*m//g' /tmp/start.txt | tail -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          fi
      - name: Capture migration runner and restorer membership authority
        if: steps.start.conclusion == 'success'
        run: |
          set -o pipefail
          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -P pager=off -c "
            select current_user as current_user,
                   session_user as session_user,
                   current_setting('server_version') as postgres_version,
                   runner_role.rolsuper as current_user_is_superuser,
                   runner_role.rolcreaterole as current_user_has_createrole,
                   runner_role.rolinherit as current_user_inherit,
                   runner_role.rolcanlogin as current_user_can_login,
                   session_role.rolsuper as session_user_is_superuser,
                   session_role.rolcreaterole as session_user_has_createrole,
                   session_role.rolinherit as session_user_inherit,
                   session_role.rolcanlogin as session_user_can_login,
                   coalesce(m.admin_option, false) as creator_admin_option,
                   coalesce(m.set_option, false) as creator_set_option,
                   coalesce(m.inherit_option, false) as creator_inherit_option
            from pg_roles runner_role
            join pg_roles session_role on session_role.rolname = session_user
            left join pg_auth_members m
              on m.roleid = (select oid from pg_roles where rolname = 'aios_restorer')
             and m.member = session_role.oid
            where runner_role.rolname = current_user;
          " | tee /tmp/restoration-runner.txt
          # Exercise the exact membership grant in a disposable transaction and roll it back.
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -c "
            begin;
            create role aios_ci_membership_probe nologin;
            grant aios_restorer to aios_ci_membership_probe;
            rollback;
          "
          test "$(psql "$DB_URL" -X -A -t -c "select count(*) from pg_roles where rolname = 'aios_ci_membership_probe'")" = "0"
          # Verify PostgreSQL grants ADMIN OPTION to a CREATEROLE role that creates a child role.
          SUPER_URL=$(printf '%s' "$DB_URL" | sed 's#://postgres:#://supabase_admin:#')
          psql "$SUPER_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          create role aios_ci_creator_probe nologin createrole;
          create role aios_ci_recipient_probe nologin;
          set local role aios_ci_creator_probe;
          create role aios_ci_child_probe nologin;
          do $guard$
          begin
            if not exists (
              select 1 from pg_auth_members m
              join pg_roles creator on creator.oid = m.member
              join pg_roles child on child.oid = m.roleid
              where creator.rolname = 'aios_ci_creator_probe'
                and child.rolname = 'aios_ci_child_probe'
                and m.admin_option
            ) then
              raise exception 'CREATEROLE role creator did not receive ADMIN OPTION'
                using errcode = '42501';
            end if;
          end
          $guard$;
          grant aios_ci_child_probe to aios_ci_recipient_probe;
          rollback;
          SQL
      - name: Run restoration role and authorization SQL regression
        if: ${{ !cancelled() && steps.start.conclusion == 'success' }}
        run: |
          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')
          SUPER_URL=$(printf '%s' "$DB_URL" | sed 's#://postgres:#://supabase_admin:#')
          psql "$SUPER_URL" -X -v ON_ERROR_STOP=1 -f tests/sql_superuser/12_part_d_restoration.sql 2>&1 | tee /tmp/restoration-role-sql.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: Run Part E audit anchoring SQL regression
        if: ${{ !cancelled() && steps.start.conclusion == 'success' }}
        run: |
          set -o pipefail
          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')
          SUPER_URL=$(printf '%s' "$DB_URL" | sed 's#://postgres:#://supabase_admin:#')
          psql "$SUPER_URL" -X -v ON_ERROR_STOP=1 -f tests/sql_superuser/13_part_e_audit_anchoring.sql 2>&1 | tee /tmp/audit-anchoring-sql.txt
      - name: Run Part E external verifier end-to-end fixture
        if: ${{ !cancelled() && steps.start.conclusion == 'success' }}
        run: |
          set -o pipefail
          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')
          SUPER_URL=$(printf '%s' "$DB_URL" | sed 's#://postgres:#://supabase_admin:#')
          bash tests/external/e2e.sh "$SUPER_URL" 2>&1 | tee /tmp/audit-anchoring-e2e.txt
      - name: Run Part E RPC tooling regression
        if: ${{ !cancelled() && steps.start.conclusion == 'success' }}
        run: |
          set -o pipefail
          python3 -m unittest -v tests.external.test_rpc_tools 2>&1 | tee /tmp/audit-rpc-tools.txt
      - name: Run SQL regression and invariant tests
        run: |
          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')
          set +e
          : > /tmp/sql.txt
          for t in tests/sql/*.sql; do echo "== $t" >> /tmp/sql.txt; psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$t" >> /tmp/sql.txt 2>&1 && echo "PASS $t" >> /tmp/sql.txt || { echo "FAILED $t" >> /tmp/sql.txt; }; done
          cat /tmp/sql.txt
          if grep -q '^FAILED' /tmp/sql.txt; then
            echo "::error title=sql-tests::$(tail -c 3500 /tmp/sql.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          fi
      - name: Prove unsafe pre-existing restorer role aborts migration without repair
        if: ${{ !cancelled() && steps.start.conclusion == 'success' }}
        run: |
          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')
          set +e
          psql "$DB_URL" -X -v ON_ERROR_STOP=0 <<'SQL' 2>&1 | tee /tmp/restoration-unsafe-role.txt
          \set VERBOSITY verbose
          begin;
          alter role aios_restorer login;
          \i supabase/migrations/20261109120000_aios_restoration_part_d.sql
          rollback;
          SQL
          rc=${PIPESTATUS[0]}
          set -e
          grep -q '42501' /tmp/restoration-unsafe-role.txt
          grep -q 'unsafe role attributes; refusing repair' /tmp/restoration-unsafe-role.txt
          test "$(psql "$DB_URL" -X -A -t -c "select rolcanlogin from pg_roles where rolname = 'aios_restorer'")" = "f"
          echo "PASS: migration rejects unsafe pre-existing role with SQLSTATE 42501 and leaves it unchanged (rollback verified)"
      # Canonical matrix: 45 SQL cases (tests/sql/05) + G4 eight-way concurrency, verified against tests/matrix/manifest.json.
      # Runs even if the generic SQL step failed so one failure never hides the other; G4 commits fixtures, so this is its only run.
      - name: Canonical test matrix (46 cases)
        if: ${{ !cancelled() && steps.start.conclusion == 'success' }}
        run: |
          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')
          set +e
          bash tests/matrix/run.sh "$DB_URL" /tmp/matrix-out 2>&1 | tee /tmp/matrix-run.txt
          rc=${PIPESTATUS[0]}
          if [ -f /tmp/matrix-out/report.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("/tmp/matrix-out/report.json"))
          print("### AiOS canonical test matrix: %s/%s %s\n" % (r["passed"], r["manifest_total"], "PASS" if r["ok"] else "FAIL"))
          print("| Domain | Passed | Expected |\n|---|---|---|")
          for d, v in r["per_domain"].items():
              print("| %s | %s | %s |" % (d, v["passed"], v["expected"]))
          for e in r["errors"]:
              print("\n- " + e)
          PY
          fi
          if [ $rc -ne 0 ]; then
            echo "::error title=canonical-matrix::$(tail -c 3000 /tmp/matrix-run.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          fi
      # Additive regression (not part of the historical 46-case matrix): parallel expiry workers converge exactly once per approval.
      - name: Expiry concurrency regression (additive)
        if: ${{ !cancelled() && steps.start.conclusion == 'success' }}
        run: |
          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')
          bash tests/concurrency/expiry_race.sh "$DB_URL" 2>&1 | tee /tmp/expiry-race.txt; exit ${PIPESTATUS[0]}
      # Real-PostgreSQL mission/task authority races (event barriers, no sleeps as proof). Commits fixtures: throwaway CI database only.
      - name: Mission/task authority races (lock order, terminal cascade)
        if: ${{ !cancelled() && steps.start.conclusion == 'success' }}
        run: |
          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')
          bash tests/concurrency/mission_task_races.sh "$DB_URL" 2>&1 | tee /tmp/mission-task-races.txt; exit ${PIPESTATUS[0]}
      # Approval resolution / expiry job / reaper against the authorizer and mission cancel (global lock order, real PostgreSQL).
      - name: Approval-path lock-order races
        if: ${{ !cancelled() && steps.start.conclusion == 'success' }}
        run: |
          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')
          set +e
          export AOLO_EVIDENCE_DIR=/tmp/approval-lock-order-evidence
          bash tests/concurrency/approval_lock_order.sh "$DB_URL" > /tmp/approval-lock-order.txt 2>&1; rc=$?
          cat /tmp/approval-lock-order.txt
          # Raw logs are not retrievable from every environment; surface the result as an annotation as well.
          lvl=notice; [ $rc -ne 0 ] && lvl=error
          echo "::$lvl title=approval-lock-order (rc=$rc)::$(sed 's/\x1b\[[0-9;]*m//g' /tmp/approval-lock-order.txt | { if [ $rc -ne 0 ]; then grep -nE '^(==|  (PASS|FAIL|barrier|deadlocks|worker exit codes))' /tmp/approval-lock-order.txt | head -c 1700; echo ' ## DIAGNOSTICS TAIL ##'; tail -c 1700 /tmp/approval-lock-order.txt; else head -c 3500 /tmp/approval-lock-order.txt; fi; } | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          exit $rc
      # Reverse-linked approval rows must resolve to their actual mission before approval/reaper pre-lock ordering.
      - name: Reverse-linked approval and stale-reaper pre-lock interleaving
        if: ${{ !cancelled() && steps.start.conclusion == 'success' }}
        run: |
          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')
          set -o pipefail
          bash tests/concurrency/reverse_linked_approval_prelock.sh "$DB_URL" 2>&1 | tee /tmp/reverse-linked-approval-prelock.txt
      - name: Reverse-linked approval lock-order static and mutation controls
        run: python3 -m unittest -v tests.security.test_reverse_linked_approval_prelock

      # Equal created_at reverse links must resolve identically in phase-one and phase-two.
      - name: Tied reverse-link approval resolver regression (real PostgreSQL)
        if: ${{ !cancelled() && steps.start.conclusion == 'success' }}
        run: |
          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')
          SUPER_URL=$(printf '%s' "$DB_URL" | sed 's#://postgres:#://supabase_admin:#')
          set -o pipefail
          bash tests/concurrency/approval_resolver_tie_break.sh "$SUPER_URL" 2>&1 | tee /tmp/approval-resolver-tie-break.txt
      - name: Shared approval resolver static and mutation controls
        run: python3 -m unittest -v tests.security.test_shared_approval_invocation_resolver

      # Deterministic (event-barrier) forced interleavings: the audit advisory lock must never be held while waiting for a row lock (expiry job, reaper),
      # and a lock conflict inside the per-record handler must be deferred, never recorded as a permanent manual_review disposition. Throwaway CI database only.
      - name: Audit-lock order forced interleavings + lock-conflict deferral
        if: ${{ !cancelled() && steps.start.conclusion == 'success' }}
        run: |
          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')
          set +e; rc=0
          for t in l3_audit_lock_forced l4_reaper_audit_lock_forced l3_lock_conflict_deferral l3_audit_lock_subtree_levels l4_reaper_whole_job_failure; do
            L3F_EVIDENCE_DIR=/tmp/forced-evidence/$t L3S_EVIDENCE_DIR=/tmp/forced-evidence/$t bash tests/concurrency/$t.sh "$DB_URL" > /tmp/$t.txt 2>&1; r=$?; cat /tmp/$t.txt
            lvl=notice; [ $r -ne 0 ] && lvl=error && rc=1
            echo "::$lvl title=$t (rc=$r)::$(sed 's/\x1b\[[0-9;]*m//g' /tmp/$t.txt | grep -E '^(==|  (PASS|FAIL|barrier))' | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          done
          exit $rc
      # Opposite multi-organization batches must acquire audit advisory locks in one global order.
      - name: Cross-organization audit advisory lock ordering
        if: ${{ !cancelled() && steps.start.conclusion == 'success' }}
        run: |
          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')
          set -o pipefail
          bash tests/concurrency/cross_org_audit_lock_order.sh "$DB_URL" 2>&1 | tee /tmp/cross-org-audit-lock-order.txt

      # Proves each smoke check fails on its target defect and the runner fails closed (86 cases). Mutations are rolled back.
      - name: Smoke suite self-test
        if: ${{ !cancelled() && steps.start.conclusion == 'success' }}
        run: |
          # selftest.sh refuses to run unless the connecting role is a superuser (it mutates inside rolled-back transactions).
          # The default local-stack URL connects as `postgres`, which is not a superuser; use the stack's `supabase_admin`.
          # This is the throwaway CI database only. The role name is not a secret; the URL (with password) is never printed.
          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')
          SUPER_URL=$(printf '%s' "$DB_URL" | sed 's#://postgres:#://supabase_admin:#')
          echo "selftest connects as: $(psql "$SUPER_URL" -X -A -t -c "select current_user || ' rolsuper=' || rolsuper from pg_roles where rolname = current_user")"
          bash scripts/smoke/selftest.sh "$SUPER_URL" 2>&1 | tee /tmp/smoke-selftest.txt
          test "${PIPESTATUS[0]}" -eq 0
      # Forced post-lock approval binding mutation while the lock worker waits on the original mission.
      - name: Approval-chain post-lock binding revalidation
        if: ${{ !cancelled() && steps.start.conclusion == 'success' }}
        run: |
          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')
          SUPER_URL=$(printf '%s' "$DB_URL" | sed 's#://postgres:#://supabase_admin:#')
          set -o pipefail
          bash tests/concurrency/approval_chain_binding_revalidation.sh "$SUPER_URL" 2>&1 | tee /tmp/approval-chain-binding-revalidation.txt

      - name: Upload test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: aios-ci-evidence
          path: |
            /tmp/matrix-out
            /tmp/matrix-run.txt
            /tmp/expiry-race.txt
            /tmp/mission-task-races.txt
            /tmp/approval-lock-order.txt
            /tmp/approval-lock-order-evidence
            /tmp/reverse-linked-approval-prelock.txt
            /tmp/approval-resolver-tie-break.txt
            /tmp/cross-org-audit-lock-order.txt
            /tmp/approval-chain-binding-revalidation.txt
            /tmp/forced-evidence
            /tmp/l3_audit_lock_forced.txt
            /tmp/l4_reaper_audit_lock_forced.txt
            /tmp/l3_lock_conflict_deferral.txt
            /tmp/l3_audit_lock_subtree_levels.txt
            /tmp/l4_reaper_whole_job_failure.txt
            /tmp/restoration-runner.txt
            /tmp/restoration-role-sql.txt
            /tmp/restoration-unsafe-role.txt
            /tmp/audit-anchoring-sql.txt
            /tmp/audit-anchoring-e2e.txt
            /tmp/audit-rpc-tools.txt
            /tmp/sql.txt
            /tmp/smoke-selftest.txt
            /tmp/start.txt
          if-no-files-found: warn
          retention-days: 90
      - name: Stop
        if: always()
        run: supabase stop --no-backup
