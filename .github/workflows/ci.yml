name: AiOS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  functions-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: Type-check Edge Functions
        run: |
          set +e
          : > /tmp/out.txt
          for f in supabase/functions/*/index.ts; do echo "== $f" >> /tmp/out.txt; deno check "$f" >> /tmp/out.txt 2>&1 || echo "FAILED $f" >> /tmp/out.txt; done
          if grep -q '^FAILED' /tmp/out.txt; then
            echo "::error title=typecheck::$(sed 's/\x1b\[[0-9;]*m//g' /tmp/out.txt | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          fi

  migrations-and-sql-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Migration version uniqueness and ordering
        run: |
          ls supabase/migrations | sed 's/_.*//' | sort | uniq -d | tee /tmp/dups
          test ! -s /tmp/dups
      - name: Start local stack and apply ALL migrations from scratch
        run: |
          set +e
          supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector > /tmp/start.txt 2>&1
          rc=$?
          if [ $rc -eq 0 ]; then supabase db reset > /tmp/reset.txt 2>&1; rc=$?; cat /tmp/reset.txt >> /tmp/start.txt; fi
          if [ $rc -ne 0 ]; then
            echo "::error title=db-start-or-reset::$(sed 's/\x1b\[[0-9;]*m//g' /tmp/start.txt | tail -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          fi
      - name: Run SQL regression and invariant tests
        run: |
          DB_URL=$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')
          for t in tests/sql/*.sql; do echo "== $t"; psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$t"; done
      - name: Stop
        if: always()
        run: supabase stop --no-backup
